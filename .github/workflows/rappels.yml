# =====================================================================
#  ANIMAUX D'ABORD — Robot des notifications push (v1.3.7)
#  ---------------------------------------------------------------------
#  GitHub exécute ce robot toutes les 5 minutes, gratuitement (dépôt public).
#  Il envoie sur les téléphones, même application fermée :
#   • les notifications de l'app (rendez-vous confirmé, commande, message,
#     nouvelle astuce, nouvelle story…) ;
#   • les rappels à heure fixe (veille 18:00-22:00, jour J 07:30-12:00,
#     heure de Tunis) ;
#  puis il fait l'entretien de la base toutes les 3 h.
#
#  Remarque : GitHub peut retarder une exécution programmée de quelques
#  minutes quand ses serveurs sont chargés. C'est normal.
#
#  À faire une seule fois : déposer la clé de service dans
#  Settings → Secrets and variables → Actions → New repository secret
#  Nom du secret : FIREBASE_SERVICE_ACCOUNT   (déjà fait)
# =====================================================================
name: Rappels push (vaccins et rendez-vous)

on:
  schedule:
    - cron: "*/5 * * * *"   # toutes les 5 minutes
  workflow_dispatch:         # bouton « Run workflow » : envoi immédiat (rappels compris)

# Deux exécutions ne doivent jamais se chevaucher.
concurrency:
  group: rappels-push
  cancel-in-progress: false

jobs:
  envoyer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install --omit=dev --no-audit --no-fund

      - name: Envoyer les notifications
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node envoyer-rappels.mjs
