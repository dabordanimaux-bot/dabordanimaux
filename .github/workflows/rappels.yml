# =====================================================================
#  ANIMAUX D'ABORD — Robot des notifications push (v1.3.8)
#  ---------------------------------------------------------------------
#  Il envoie sur les téléphones, même application fermée :
#   • les notifications de l'app (rendez-vous confirmé, commande, message,
#     nouvelle astuce, nouvelle story…) ;
#   • les rappels à heure fixe (veille 18:00-22:00, jour J 07:30-12:00,
#     heure de Tunis) ;
#  puis il fait l'entretien de la base toutes les 3 h.
#
#  QUI LE RÉVEILLE ?
#   1) cron-job.org (gratuit), toutes les 5 minutes : il appelle GitHub avec
#      le mode « auto ». C'est le réveil principal, fiable.
#   2) La programmation de GitHub ci-dessous, en SECOURS seulement : GitHub
#      la retarde souvent de plusieurs heures, ou la saute.
#   3) Le bouton « Run workflow » (mode « manuel » par défaut) : tout est
#      envoyé tout de suite, rappels compris, même hors des heures d'envoi.
#
#  À faire une seule fois : déposer la clé de service dans
#  Settings → Secrets and variables → Actions → New repository secret
#  Nom du secret : FIREBASE_SERVICE_ACCOUNT   (déjà fait)
# =====================================================================
name: Rappels push (vaccins et rendez-vous)

on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # secours : toutes les 15 min (hors des heures pleines)
  workflow_dispatch:
    inputs:
      mode:
        description: "manuel = tout envoyer maintenant (rappels compris) · auto = comme un réveil automatique"
        type: choice
        options:
          - manuel
          - auto
        default: manuel

# Deux exécutions ne doivent jamais se chevaucher.
concurrency:
  group: rappels-push
  cancel-in-progress: false

jobs:
  envoyer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install --omit=dev --no-audit --no-fund

      - name: Envoyer les notifications
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MODE_LANCEMENT: ${{ inputs.mode }}
        run: node envoyer-rappels.mjs
