    try{ await window.Cloud.put("_config", { id: "agenda", datesPrises: dates }); }catch(e){ this.toast(t("Enregistrement impossible. Vérifiez la connexion."), "err"); }
  }
};
window.App = App;

    document.addEventListener("DOMContentLoaded", function(){ App.init(); });
  </script>
  <script type="module">
/* =====================================================================
   FIREBASE — connexion, base de données, notifications push
   ---------------------------------------------------------------------
   Ce module crée window.Cloud et window.Push, utilisés par l'app.
   La configuration vient de config.js (window.APP_CONFIG).
   ===================================================================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager,
         collection, doc, getDoc, getDocs, setDoc, deleteDoc, onSnapshot, query, where }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getMessaging, getToken, deleteToken, onMessage, isSupported as messagingSupported }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut,
         EmailAuthProvider, reauthenticateWithCredential, updatePassword, deleteUser,
         sendPasswordResetEmail, verifyBeforeUpdateEmail }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const CONF  = window.APP_CONFIG || {};
const FB    = CONF.firebase || {};
const VAPID = /REMPLIR/i.test(CONF.vapidKey || "") ? "" : (CONF.vapidKey || "").trim();
const configOK = !!(FB.apiKey && FB.projectId && !/REMPLIR/i.test(FB.apiKey + FB.projectId));

let fbApp = null, db = null, auth = null, resolveReady;
const IDX = "loginIndex", TOKENS = "pushTokens";
const appRef = () => { try{ return window.App || null; }catch(e){ return null; } };
const langue = () => { try{ return localStorage.getItem("as_lang") === "ar" ? "ar" : "fr"; }catch(e){ return "fr"; } };
const avecDelai = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("delai")), ms))]);

const Cloud = {
  configOK, enabled: false,
  ready: new Promise(r => { resolveReady = r; }),
  _ecoutes: [],

  /* ---------------- Authentification ---------------- */
  onAuth: (cb) => onAuthStateChanged(auth, cb),
  signUp: (email, pass) => createUserWithEmailAndPassword(auth, email, pass),
  signIn: (email, pass) => signInWithEmailAndPassword(auth, email, pass),
  signOut: () => signOut(auth),
  uid: () => (auth && auth.currentUser) ? auth.currentUser.uid : null,
  authEmail: () => (auth && auth.currentUser && auth.currentUser.email) || "",

  async resetPassword(email){
    auth.languageCode = langue();
    await sendPasswordResetEmail(auth, email);
  },
  async changePassword(ancien, nouveau){
    const u = auth.currentUser; if(!u) throw new Error("aucun-compte");
    await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, ancien));
    await updatePassword(u, nouveau);
  },
  // Changement d'e-mail : Firebase envoie un lien à la NOUVELLE adresse et ne
  // l'applique qu'une fois ce lien touché. « pending » permet de se connecter
  // par numéro avec la nouvelle adresse dès qu'elle est confirmée.
  async changeEmail(nouvel, pass, cle){
    const u = auth.currentUser; if(!u) throw new Error("aucun-compte");
    await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, pass));
    auth.languageCode = langue();
    await verifyBeforeUpdateEmail(u, nouvel);
    if(cle){
      try{
        const ref = doc(db, IDX, String(cle)); const d = await getDoc(ref);
        if(!d.exists() || d.data().uid === u.uid)
          await setDoc(ref, { email: u.email, uid: u.uid, pending: nouvel, ts: Date.now() });
      }catch(e){ console.warn("loginIndex pending", e); }
    }
  },

  /* ---------------- Annuaire numéro -> e-mail ---------------- */
  async lookupPhone(cle){
    if(!db || !cle) return null;
    try{ const d = await avecDelai(getDoc(doc(db, IDX, String(cle))), 6000); return d.exists() ? d.data() : null; }
    catch(e){ console.warn("loginIndex lecture", e); return null; }
  },
  async syncLoginIndex(cle){
    const u = auth && auth.currentUser; if(!db || !u || !cle) return;
    try{
      const ref = doc(db, IDX, String(cle)); const d = await getDoc(ref);
      const cur = d.exists() ? d.data() : null;
      if(cur && cur.uid !== u.uid) return;
      if(cur && cur.email === u.email) return;
      await setDoc(ref, { email: u.email, uid: u.uid, ts: Date.now() });
    }catch(e){ console.warn("loginIndex", e); }
  },
  async movePhone(ancienne, nouvelle){
    const u = auth && auth.currentUser; if(!db || !u || !nouvelle || ancienne === nouvelle) return;
    try{
      const oref = ancienne ? doc(db, IDX, String(ancienne)) : null;
      const od = oref ? await getDoc(oref) : null;
      const aMoi = !!(od && od.exists() && od.data().uid === u.uid);
      const nref = doc(db, IDX, String(nouvelle)); const nd = await getDoc(nref);
      if(nd.exists() && nd.data().uid !== u.uid) return;
      const data = { email: u.email, uid: u.uid, ts: Date.now() };
      if(aMoi && od.data().pending) data.pending = od.data().pending;
      await setDoc(nref, data);
      if(aMoi) await deleteDoc(oref);
    }catch(e){ console.warn("loginIndex numéro", e); }
  },
  async removeLoginIndex(cle, uid){
    if(!db || !cle) return;
    try{
      const ref = doc(db, IDX, String(cle)); const d = await getDoc(ref);
      if(d.exists() && (!uid || d.data().uid === uid)) await deleteDoc(ref);
    }catch(e){ console.warn("loginIndex suppression", e); }
  },

  /* ---------------- Données ---------------- */
  async getProfile(uid){
    const d = await getDoc(doc(db, "users", String(uid)));
    return d.exists() ? d.data() : null;
  },
  async get(coll, id){
    const d = await getDoc(doc(db, coll, String(id)));
    return d.exists() ? d.data() : null;
  },
  put: (coll, obj) => setDoc(doc(db, coll, String(obj.id)), obj, { merge: true }),
  patch: (coll, id, champs) => setDoc(doc(db, coll, String(id)), champs, { merge: true }),
  del: (coll, id) => deleteDoc(doc(db, coll, String(id))),
  async listWhere(coll, champ, valeur){
    const snap = await getDocs(query(collection(db, coll), where(champ, "==", valeur)));
    return snap.docs.map(d => d.data());
  },

  // Écoutes en temps réel. Chaque entrée : { cle, coll, ou:[champ, valeur] } ou { cle, doc:[coll, id] }.
  // Plusieurs entrées peuvent partager la même clé : leurs résultats sont fusionnés.
  watch(spec, cb){
    this.stopAll();
    const parts = {};
    spec.forEach((s, i) => {
      const fin = (arr) => {
        parts[s.cle] = parts[s.cle] || {}; parts[s.cle][i] = arr;
        const fusion = new Map();
        Object.values(parts[s.cle]).forEach(a => a.forEach(o => { if(o && o.id != null) fusion.set(String(o.id), o); }));
        cb(s.cle, s.doc ? (arr[0] || null) : Array.from(fusion.values()));
      };
      const erreur = (e) => { console.warn("écoute " + s.cle, e); fin([]); };
      let unsub;
      if(s.doc){
        unsub = onSnapshot(doc(db, s.doc[0], String(s.doc[1])), d => fin(d.exists() ? [d.data()] : []), erreur);
      } else {
        const c = collection(db, s.coll);
        const q = s.ou ? query(c, where(s.ou[0], "==", s.ou[1])) : c;
        unsub = onSnapshot(q, snap => { const a = []; snap.forEach(d => a.push(d.data())); fin(a); }, erreur);
      }
      this._ecoutes.push(unsub);
    });
  },
  stopAll(){ this._ecoutes.forEach(u => { try{ u(); }catch(e){} }); this._ecoutes = []; },

  /* ---------------- Suppression du compte par le client ---------------- */
  async deleteMyAccount(pass, info){
    const u = auth.currentUser; if(!u || !db) throw new Error("aucun-compte");
    await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, pass));
    const uid = u.uid; let echecs = 0;
    const PROPRIO = [["livraisons", "clientId"], ["demandes", "clientId"], ["avis", "clientId"], ["notifs", "target"]];
    for(const [coll, champ] of PROPRIO){
      try{
        const snap = await getDocs(query(collection(db, coll), where(champ, "==", uid)));
        const res = await Promise.allSettled(snap.docs.map(d => deleteDoc(d.ref)));
        echecs += res.filter(r => r.status === "rejected").length;
      }catch(e){ echecs++; console.warn("suppression " + coll, e); }
    }
    try{ await Push.disable(); }catch(e){}
    try{ if(info && info.cle) await Cloud.removeLoginIndex(info.cle, uid); }catch(e){}
    try{ if(info && info.notif) await setDoc(doc(db, "notifs", info.notif.id), info.notif); }catch(e){ console.warn("notif", e); }
    if(!echecs){ try{ await deleteDoc(doc(db, "users", uid)); }catch(e){ echecs++; } }
    await deleteUser(u);
    return { echecs };
  }
};
window.Cloud = Cloud;

/* =====================================================================
   NOTIFICATIONS PUSH (Firebase Cloud Messaging)
   Le jeton identifie UN appareil : collection pushTokens, un document par
   appareil. Le robot GitHub (scripts/envoyer-notifications.mjs) lit les
   notifications « en attente » et les envoie à ces jetons.
   ===================================================================== */
function appareil(){
  let id = null; try{ id = localStorage.getItem("as_device"); }catch(e){}
  if(!id){ id = "dev_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); try{ localStorage.setItem("as_device", id); }catch(e){} }
  return id;
}
const Push = {
  supported: false, _msg: null, token: null,
  permission(){ try{ return typeof Notification !== "undefined" ? Notification.permission : "unsupported"; }catch(e){ return "unsupported"; } },
  etat(){
    if(!VAPID) return "non-configure";            // vapidKey pas encore ajoutée dans config.js
    if(!this.supported){
      const ios = /iphone|ipad|ipod/i.test(navigator.userAgent || "");
      const installe = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches;
      return (ios && !installe) ? "ios-installer" : "indisponible";
    }
    return this.permission();     // granted | default | denied
  },
  async init(){
    try{
      this.supported = ("serviceWorker" in navigator) && ("PushManager" in window) &&
                       (typeof Notification !== "undefined") && !!VAPID && await messagingSupported();
    }catch(e){ this.supported = false; }
    if(!this.supported || !fbApp) return;
    try{ this._msg = getMessaging(fbApp); }catch(e){ this.supported = false; return; }
    try{ onMessage(this._msg, p => { const A = appRef(); A && A.onPushPremierPlan && A.onPushPremierPlan((p && p.data) || {}); }); }catch(e){}
    // Le jeton n'est enregistré qu'une fois connecté (App.onAuth) : les règles l'exigent.
  },
  async register(){
    if(!this.supported) throw new Error("unsupported");
    const perm = await Notification.requestPermission();
    if(perm !== "granted") throw new Error(perm);
    const reg = await navigator.serviceWorker.ready;
    if(!this._msg) this._msg = getMessaging(fbApp);
    const token = await getToken(this._msg, { vapidKey: VAPID, serviceWorkerRegistration: reg });
    if(!token) throw new Error("no-token");
    this.token = token;
    await this.save();
    return token;
  },
  async save(){
    if(!db || !this.token) return;
    const A = appRef(); const u = A && A.profil ? A.profil() : null;
    const data = { id: appareil(), token: this.token, lang: langue(), agent: (navigator.userAgent || "").slice(0, 150), updatedAt: Date.now() };
    if(u){ data.userId = u.id; data.role = u.role || "client"; data.nom = u.nom || ""; }
    try{ await setDoc(doc(db, TOKENS, appareil()), data, { merge: true }); }catch(e){ console.warn("pushTokens", e); }
  },
  async relink(){ if(this.token) await this.save(); },
  async unlink(){
    if(!db) return;
    try{ await setDoc(doc(db, TOKENS, appareil()), { userId: null, role: null, nom: "", updatedAt: Date.now() }, { merge: true }); }catch(e){}
  },
  async disable(){
    try{ if(this._msg) await deleteToken(this._msg); }catch(e){}
    this.token = null;
    try{ if(db) await deleteDoc(doc(db, TOKENS, appareil())); }catch(e){}
  }
};
window.Push = Push;

/* ---------------- Initialisation ---------------- */
if(!configOK){
  resolveReady(false);
} else {
  try{
    fbApp = initializeApp(FB);
    try{ db = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
    catch(e){ db = getFirestore(fbApp); }
    auth = getAuth(fbApp);
    Cloud.enabled = true;
    Push.init();
    resolveReady(true);
  }catch(e){
    console.error("Firebase", e);
    resolveReady(false);
  }
}

  </script>
