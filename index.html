/* =====================================================================
   ACHREF SAKOUHI — PHOTOGRAPHE
   Direction artistique : « l'album de velours ».
   Fond bordeaux profond (velours d'album, kesswa de mariée), texte ivoire,
   fil d'or réservé au monogramme, aux repères du viseur et aux actions
   principales. Les livraisons ressemblent à des pochettes de labo photo.
   ===================================================================== */
@font-face{font-family:"Bodoni Moda";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/bodoni-moda-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Bodoni Moda";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/bodoni-moda-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Bodoni Moda";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/bodoni-moda-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:"Bodoni Moda";font-style:italic;font-weight:500;font-display:swap;src:url(fonts/bodoni-moda-latin-500-italic.woff2) format("woff2")}
@font-face{font-family:"Jost";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/jost-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Jost";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/jost-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Jost";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/jost-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Tajawal";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/tajawal-arabic-400-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Tajawal";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/tajawal-arabic-500-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Tajawal";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/tajawal-arabic-700-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF}

:root{
  color-scheme: dark;
  --velours:#2A0E17;      /* fond de page */
  --velours-2:#351421;    /* surfaces */
  --velours-3:#43192A;    /* surfaces relevées, champs */
  --encre:#1B080E;        /* barre du bas, ombres */
  --ivoire:#F3EADB;       /* texte principal */
  --ivoire-2:#CDBDAA;     /* texte secondaire */
  --sourdine:#9E8783;     /* texte discret */
  --or:#C9A45C;           /* fil d'or : actions principales */
  --or-clair:#E9D3A2;
  --ligne:rgba(243,234,219,.12);
  --ligne-2:rgba(243,234,219,.2);
  --papier:#EFE4D1;       /* pochette de labo */
  --papier-2:#E4D5BD;
  --papier-encre:#3B2417;
  --ok:#A7C38C; --alerte:#E9B95F; --danger:#E7826F;
  --f-titre:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-texte:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  --t-xs:.8rem; --t-s:.9rem; --t-m:1rem; --t-l:1.25rem; --t-xl:1.563rem; --t-2xl:1.953rem; --t-3xl:2.441rem;
  --r-champ:10px; --r-carte:18px; --r-pochette:5px;
  --maxw:560px;
  --barre:64px;
  --sur-haut:env(safe-area-inset-top,0px); --sur-bas:env(safe-area-inset-bottom,0px);
}
html[lang="ar"]{--f-texte:"Tajawal","Jost",system-ui,sans-serif;--f-titre:"Tajawal","Bodoni Moda",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--velours);color:var(--ivoire)}
body{font-family:var(--f-texte);font-size:var(--t-m);line-height:1.55;min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{max-width:100%;display:block}
a{color:var(--or-clair)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--or);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ---------- typographie ---------- */
h1,h2,h3{font-family:var(--f-titre);font-weight:400;margin:0;letter-spacing:-.01em;line-height:1.15}
h1{font-size:var(--t-3xl)} h2{font-size:var(--t-2xl)} h3{font-size:var(--t-l)}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-weight:700;letter-spacing:0;line-height:1.3}
.ital{font-style:italic}
html[lang="ar"] .ital{font-style:normal}
p{margin:0 0 .8em}
.doux{color:var(--ivoire-2)} .discret{color:var(--sourdine);font-size:var(--t-s)}
.petit{font-size:var(--t-s)}

/* ---------- démarrage : diaphragme ---------- */
#boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--velours);transition:opacity .5s ease}
#boot.fini{opacity:0;pointer-events:none}
.iris{width:112px;height:112px}
.iris .lame{transform-origin:50px 50px;animation:iris 1.6s cubic-bezier(.6,0,.2,1) infinite alternate}
@keyframes iris{from{transform:rotate(0deg) scale(1)}to{transform:rotate(38deg) scale(.86)}}

/* ---------- coque de l'app ---------- */
.ecran{min-height:100vh}
.entete{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--sur-haut)) 16px 10px;background:var(--velours)}
.entete::after{content:"";position:absolute;left:0;right:0;top:100%;height:16px;background:linear-gradient(var(--velours),rgba(42,14,23,0));pointer-events:none}
.entete .marque{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-decoration:none;color:inherit}
.entete .marque img{width:38px;height:38px}
.entete .nom{font-family:var(--f-titre);font-style:italic;font-size:1.15rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .entete .nom{font-style:normal;font-weight:700}
.entete .metier{display:block;font-family:var(--f-texte);font-style:normal;font-size:.78rem;color:var(--sourdine);letter-spacing:.02em}
.btn-icone{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--ligne);background:var(--velours-2);
  display:grid;place-items:center;cursor:pointer;color:var(--ivoire);padding:0}
.btn-icone svg{width:20px;height:20px}
.btn-langue{width:auto;padding:0 14px;border-radius:21px;font-size:.88rem;font-weight:500}
html[lang="ar"] #btn-sortir svg{transform:scaleX(-1)}
@media (max-width:389px){.entete{gap:7px;padding-inline:12px}.btn-langue{padding:0 10px;font-size:.82rem}.entete .marque img{width:32px;height:32px}.entete .nom{font-size:1.05rem}}
.pastille{position:absolute;top:-3px;inset-inline-end:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;
  background:var(--or);color:var(--encre);font-size:.72rem;font-weight:600;display:grid;place-items:center;border:2px solid var(--velours)}
.contenu{max-width:var(--maxw);margin:0 auto;padding:6px 16px calc(var(--barre) + 28px + var(--sur-bas))}

/* barre d'onglets */
.onglets{position:fixed;inset-inline:0;bottom:0;z-index:30;display:flex;justify-content:space-around;
  padding:6px 6px calc(6px + var(--sur-bas));background:rgba(27,8,14,.96);border-top:1px solid var(--ligne);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.onglets button{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;
  background:none;border:0;color:var(--sourdine);font-size:.72rem;cursor:pointer;position:relative;border-radius:12px}
.onglets button svg{width:22px;height:22px}
.onglets button.actif{color:var(--or-clair)}
.onglets button.actif::before{content:"";position:absolute;top:-7px;width:26px;height:2px;background:var(--or);border-radius:2px}
.onglets .pastille{top:0;inset-inline-end:calc(50% - 22px)}

/* ---------- boutons et champs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:23px;
  border:1px solid var(--ligne-2);background:var(--velours-3);color:var(--ivoire);font-weight:500;font-size:.98rem;
  cursor:pointer;text-decoration:none;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn svg{width:19px;height:19px}
.btn-or{background:var(--or);border-color:var(--or);color:var(--encre);font-weight:600}
.btn-or:hover{background:#D3B06B}
.btn-clair{background:transparent}
.btn-danger{background:transparent;border-color:rgba(231,130,111,.5);color:var(--danger)}
.btn-bloc{display:flex;width:100%}
.btn-petit{min-height:36px;padding:0 14px;font-size:.88rem;border-radius:18px}
.btn[disabled]{opacity:.55;pointer-events:none}
.lien{background:none;border:0;padding:4px 0;color:var(--or-clair);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:.92rem}
.rangee{display:flex;gap:10px;flex-wrap:wrap}
.rangee>.btn{flex:1}

.champ{margin-bottom:14px}
.champ>label,.etiquette{display:block;font-size:.86rem;color:var(--ivoire-2);margin-bottom:6px}
.saisie,textarea.saisie,select.saisie{width:100%;min-height:48px;padding:12px 14px;border-radius:var(--r-champ);border:1px solid var(--ligne-2);
  background:var(--velours-3);color:var(--ivoire);font-size:1rem;outline:none;transition:border-color .15s}
textarea.saisie{min-height:96px;resize:vertical;line-height:1.5}
.saisie::placeholder{color:var(--sourdine)}
.saisie:focus{border-color:var(--or)}
select.saisie{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ivoire-2) 50%),linear-gradient(135deg,var(--ivoire-2) 50%,transparent 50%);
  background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:36px}
html[lang="ar"] select.saisie{background-position:15px 21px,20px 21px}
input[type="date"].saisie{color-scheme:dark}
.aide{font-size:.84rem;color:var(--sourdine);margin-top:6px}
html[lang="ar"] input[type="tel"],html[lang="ar"] input[type="email"],html[lang="ar"] #co-id,html[lang="ar"] #mo-id,html[lang="ar"] input[type="url"]{direction:ltr;text-align:right}
html[lang="ar"] input[type="tel"]:placeholder-shown,html[lang="ar"] input[type="email"]:placeholder-shown,html[lang="ar"] #co-id:placeholder-shown,html[lang="ar"] #mo-id:placeholder-shown,html[lang="ar"] input[type="url"]:placeholder-shown{direction:rtl}
.mdp{position:relative}
.mdp .saisie{padding-inline-end:52px}
.oeil{position:absolute;top:50%;inset-inline-end:5px;transform:translateY(-50%);width:42px;height:42px;border:0;background:none;color:var(--sourdine);
  display:grid;place-items:center;cursor:pointer;border-radius:10px}
.oeil.on{color:var(--or-clair)} .oeil svg{width:20px;height:20px}
.case{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.95rem}
.case input{width:20px;height:20px;accent-color:var(--or)}

/* ---------- blocs ---------- */
.bloc{background:var(--velours-2);border:1px solid var(--ligne);border-radius:var(--r-carte);padding:18px;margin-bottom:14px}
.bloc>h3{margin-bottom:12px}
.titre-section{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px}
.titre-section h2{font-size:var(--t-xl)}
.vide{text-align:center;padding:34px 18px;border:1px dashed var(--ligne-2);border-radius:var(--r-carte);color:var(--ivoire-2)}
.vide>svg{width:34px;height:34px;color:var(--or);margin-bottom:8px}
.vide h3{margin-bottom:6px}
.liste{display:flex;flex-direction:column}
.ligne{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--ligne);background:none;border-inline:0;border-top:0;
  width:100%;text-align:start;cursor:pointer;color:inherit}
.ligne:last-child{border-bottom:0}
.ligne .corps{flex:1;min-width:0}
.ligne .t{font-weight:500}
.ligne .s{font-size:.86rem;color:var(--sourdine);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ligne .t,.ligne .s,.ligne .corps>.discret{display:block}
.chev{color:var(--sourdine);width:18px;height:18px;flex:none}
html[lang="ar"] .chev{transform:scaleX(-1)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--velours-3);display:grid;place-items:center;flex:none;
  font-family:var(--f-titre);font-style:italic;color:var(--or-clair);font-size:1.05rem;border:1px solid var(--ligne)}
.etat{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:12px;font-size:.78rem;font-weight:500;white-space:nowrap;
  border:1px solid var(--ligne-2);color:var(--ivoire-2)}
.etat.ok{color:var(--ok);border-color:rgba(167,195,140,.45)}
.etat.alerte{color:var(--alerte);border-color:rgba(233,185,95,.45)}
.etat.danger{color:var(--danger);border-color:rgba(231,130,111,.45)}
.etat.or{color:var(--or-clair);border-color:rgba(201,164,92,.5)}
.puces{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.puces::-webkit-scrollbar{display:none}
.puce{flex:none;padding:7px 15px;border-radius:18px;border:1px solid var(--ligne-2);background:none;color:var(--ivoire-2);cursor:pointer;font-size:.9rem}
.puce.on{background:var(--ivoire);color:var(--encre);border-color:var(--ivoire)}

/* ---------- écran de connexion ---------- */
.accueil-auth{min-height:100vh;display:flex;flex-direction:column}
.viseur{position:relative;display:grid;place-items:center;padding:calc(48px + var(--sur-haut)) 24px 30px;text-align:center}
.viseur .cadre{position:relative;width:min(78vw,320px);aspect-ratio:1/1;display:grid;place-items:center}
.coin{position:absolute;width:34px;height:34px;border-color:var(--or);border-style:solid;border-width:0}
.coin.hg{top:0;left:0;border-top-width:2px;border-left-width:2px}
.coin.hd{top:0;right:0;border-top-width:2px;border-right-width:2px}
.coin.bg{bottom:0;left:0;border-bottom-width:2px;border-left-width:2px}
.coin.bd{bottom:0;right:0;border-bottom-width:2px;border-right-width:2px}
.mise-au-point .coin{animation:map-coin 1.4s cubic-bezier(.2,.7,.1,1) both}
.mise-au-point .coin.hg{--dx:-26px;--dy:-26px}.mise-au-point .coin.hd{--dx:26px;--dy:-26px}
.mise-au-point .coin.bg{--dx:-26px;--dy:26px}.mise-au-point .coin.bd{--dx:26px;--dy:26px}
@keyframes map-coin{0%{transform:translate(var(--dx),var(--dy));opacity:0}40%{opacity:1}70%{transform:translate(calc(var(--dx)*-.12),calc(var(--dy)*-.12))}100%{transform:none}}
.mise-au-point .net{animation:map-net 1.4s cubic-bezier(.2,.7,.1,1) both}
@keyframes map-net{0%{filter:blur(14px);opacity:.25;transform:scale(1.06)}100%{filter:none;opacity:1;transform:none}}
.point{width:6px;height:6px;border-radius:50%;background:var(--or);position:absolute;bottom:22%;left:50%;margin-left:-3px}
.mise-au-point .point{animation:map-point 1.4s steps(1) both}
@keyframes map-point{0%,62%{opacity:0}63%,75%{opacity:1}76%,85%{opacity:0}86%,100%{opacity:1}}
.viseur .monogramme{font-family:"Bodoni Moda",serif;font-style:italic;font-size:clamp(5rem,24vw,7.5rem);color:var(--or-clair);line-height:1;letter-spacing:-.05em;margin-top:-6%}
.viseur h1{margin-top:22px;font-style:italic;font-size:clamp(2rem,9vw,2.6rem)}
html[lang="ar"] .viseur h1{font-style:normal}
.viseur .sous{color:var(--ivoire-2);margin-top:6px}
.carte-auth{width:100%;max-width:440px;margin:0 auto;padding:0 18px 30px}
.bascule{display:flex;padding:4px;border-radius:24px;background:var(--velours-2);border:1px solid var(--ligne);margin-bottom:18px}
.bascule button{flex:1;min-height:40px;border:0;border-radius:20px;background:none;color:var(--ivoire-2);cursor:pointer;font-weight:500}
.bascule button.on{background:var(--ivoire);color:var(--encre)}
.oubli{display:flex;justify-content:flex-end;margin:-4px 0 14px}
.legal{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:18px;font-size:.86rem}
.legal a{color:var(--ivoire-2)}
.coin-langue{position:absolute;top:calc(14px + var(--sur-haut));inset-inline-end:14px;z-index:2}
.accueil-auth .viseur{padding-top:calc(80px + var(--sur-haut))}
.accueil-auth .viseur .cadre{width:min(72vw,300px)}
.installer-auth{margin-top:22px;padding-top:18px;border-top:1px solid var(--ligne);text-align:center}
.installer-auth .discret{margin-top:8px}

/* ---------- accueil client : héros ---------- */
.heros{position:relative;margin:0 -16px 8px;aspect-ratio:4/5;max-height:72vh;overflow:hidden;background:
  radial-gradient(120% 80% at 50% 30%,#4A1B29 0%,var(--velours) 70%)}
.heros .diapo{position:absolute;inset:0;background-size:cover;background-position:var(--fp,50% 45%);transform-origin:var(--fp,50% 45%);opacity:0;transition:opacity 1.6s ease}
.heros .diapo.on{opacity:1;animation:lent 14s linear both}
@keyframes lent{from{transform:scale(1.08)}to{transform:scale(1)}}
.heros::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(42,14,23,.25) 0%,rgba(42,14,23,.05) 22%,rgba(42,14,23,.55) 50%,rgba(42,14,23,.93) 72%,rgba(42,14,23,.98) 100%)}
.heros .cadre{position:absolute;inset:22px 22px 232px;z-index:2;pointer-events:none}
.heros .texte{position:absolute;inset-inline:22px;bottom:22px;z-index:3}
.heros h1{font-style:italic;font-size:clamp(2.1rem,9vw,2.9rem);max-width:13ch}
html[lang="ar"] .heros h1{font-style:normal}
.heros .rangee{margin-top:16px}
.heros .rangee .btn{flex:1 1 auto;white-space:nowrap;padding:0 16px}
.heros.court{aspect-ratio:1/1;max-height:62vh}
.cadrage-photo{display:flex;gap:14px;align-items:flex-start}
.cadrage-photo>div:first-child{flex:1;min-width:0}
.apercu-cadrage{flex:none;width:92px;aspect-ratio:4/5;border-radius:6px;background-size:cover;border:1px solid var(--ligne-2);margin-top:26px;transition:background-position .3s}
.heros.sans-photo .monogramme-fond{position:absolute;inset:0;display:grid;place-items:center;font-family:"Bodoni Moda",serif;font-style:italic;
  font-size:min(52vw,260px);color:rgba(201,164,92,.13);letter-spacing:-.05em;padding-bottom:30%}

/* ---------- pochette de labo (livraison) ---------- */
.pochette{position:relative;background:var(--papier);color:var(--papier-encre);border-radius:var(--r-pochette);padding:26px 18px 18px;
  margin-bottom:16px;box-shadow:0 14px 30px rgba(10,2,5,.45);overflow:hidden}
.pochette::before{content:"";position:absolute;top:9px;inset-inline:12px;height:6px;
  background:radial-gradient(circle,rgba(59,36,23,.28) 2.2px,transparent 2.6px) 0 0/14px 6px repeat-x}
.pochette .labo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pochette h3{font-family:var(--f-titre);font-style:italic;font-size:1.45rem;color:var(--papier-encre)}
html[lang="ar"] .pochette h3{font-style:normal}
.pochette .meta{font-size:.9rem;color:#6B5242;margin-top:4px}
.pochette .mot{margin:12px 0 0;padding:10px 12px;border-inline-start:2px solid #B89A6A;background:rgba(59,36,23,.05);font-size:.95rem}
.pochette .liens{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.pochette .btn{background:var(--papier-encre);color:var(--papier);border-color:var(--papier-encre)}
.pochette .btn.btn-clair{background:transparent;color:var(--papier-encre);border-color:rgba(59,36,23,.35)}
.pochette .pied{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px dashed rgba(59,36,23,.3);font-size:.88rem}
.tampon{flex:none;width:88px;height:88px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;text-align:center;
  transform:rotate(-9deg);color:#8B2E2E;font-size:.7rem;line-height:1.15;padding:6px;opacity:.85}
.tampon b{display:block;font-family:"Bodoni Moda",serif;font-size:1.25rem;font-weight:500;margin:1px 0}
html[lang="ar"] .tampon b{font-family:var(--f-texte)}
.tampon.ok{color:#4E6B3A}.tampon.fin{color:#7C6A5C}
.pochette.nouvelle{animation:arrivee .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes arrivee{from{transform:translateY(18px) rotate(-1.5deg);opacity:0}to{transform:none;opacity:1}}
.pochette.fermee{background:var(--papier-2)}
.conseils{margin-top:10px}
.conseils summary{cursor:pointer;color:var(--or-clair);font-size:.95rem;padding:6px 0}
.conseils ol{margin:8px 0 0;padding-inline-start:20px;color:var(--ivoire-2)}
.conseils li{margin-bottom:6px}

/* ---------- étapes, avis, forfaits ---------- */
.etapes{counter-reset:e;list-style:none;margin:0;padding:0}
.etapes li{counter-increment:e;display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--ligne)}
.etapes li:last-child{border-bottom:0}
.etapes li::before{content:counter(e);font-family:"Bodoni Moda",serif;font-style:italic;font-size:1.9rem;color:var(--or);line-height:1}
.etapes b{display:block;font-weight:500;margin-bottom:2px}
.avis-carte{padding:16px 0;border-bottom:1px solid var(--ligne)}
.avis-carte:last-child{border-bottom:0}
.avis-carte blockquote{margin:0 0 8px;font-family:var(--f-titre);font-style:italic;font-size:1.12rem;line-height:1.45}
html[lang="ar"] .avis-carte blockquote{font-style:normal}
.etoiles{color:var(--or);letter-spacing:2px;font-size:.95rem}
.choix-etoiles{display:flex;gap:6px;direction:ltr;justify-content:center;margin:6px 0 14px}
.choix-etoiles button{width:46px;height:46px;border:0;background:none;color:var(--sourdine);font-size:2rem;cursor:pointer;line-height:1}
.choix-etoiles button.on{color:var(--or)}
.forfait{display:block;width:100%;padding:16px 0;border:0;border-bottom:1px solid var(--ligne);background:none;color:inherit;font:inherit;text-align:start;cursor:pointer}
.forfait .desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:6px}
.forfait .voir{display:inline-flex;align-items:center;gap:4px;margin-top:8px;color:var(--or);font-size:.9rem}
.forfait .voir .chev{color:var(--or);width:16px;height:16px}
.forfait:active{opacity:.8}
.prix-offre{font-family:"Bodoni Moda",serif;font-size:1.7rem;color:var(--or-clair);margin-bottom:8px}
html[lang="ar"] .prix-offre{font-family:var(--f-texte);font-weight:700}
.inclus{list-style:none;margin:0;padding:0}
.inclus li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--ligne)}
.inclus li:last-child{border-bottom:0}
.inclus svg{width:18px;height:18px;color:var(--or);flex:none;margin-top:2px}
.forfait:last-child{border-bottom:0}
.forfait .haut{display:flex;width:100%;justify-content:space-between;align-items:baseline;gap:12px}
.forfait .nom-f{font-family:var(--f-titre);font-size:var(--t-l);line-height:1.15;font-style:italic}
html[lang="ar"] .forfait .nom-f{font-style:normal}
.forfait .prix{color:var(--or-clair);font-weight:500;white-space:nowrap}
.forfait ul{margin:8px 0 0;padding-inline-start:18px;color:var(--ivoire-2);font-size:.94rem}

/* ---------- portfolio ---------- */
.mosaique{columns:2;column-gap:8px}
.mosaique button{display:block;width:100%;margin:0 0 8px;padding:0;border:0;background:var(--velours-3);border-radius:4px;overflow:hidden;cursor:zoom-in;break-inside:avoid}
.mosaique img{width:100%;height:auto}
.visionneuse{position:fixed;inset:0;z-index:80;background:rgba(14,4,8,.97);display:flex;flex-direction:column}
.visionneuse .barre{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + var(--sur-haut)) 12px 10px}
.visionneuse .scene{flex:1;display:grid;place-items:center;overflow:hidden;touch-action:pan-y;position:relative}
.visionneuse .scene img{max-width:100%;max-height:100%;object-fit:contain;transition:filter .4s}
.visionneuse .scene img.flou{filter:blur(10px)}
.visionneuse .legende{padding:10px 18px calc(16px + var(--sur-bas));text-align:center;color:var(--ivoire-2);min-height:48px}
.visionneuse .nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2}
.visionneuse .nav.prec{inset-inline-start:8px}.visionneuse .nav.suiv{inset-inline-end:8px}
html[lang="ar"] .visionneuse .nav svg{transform:scaleX(-1)}

/* ---------- feuille (fenêtre du bas) ---------- */
.voile{position:fixed;inset:0;z-index:60;background:rgba(14,4,8,.62);display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s}
.voile.ouvert{opacity:1;pointer-events:auto}
.feuille{width:100%;max-width:var(--maxw);max-height:90vh;display:flex;flex-direction:column;background:var(--velours-2);
  border:1px solid var(--ligne);border-bottom:0;border-radius:22px 22px 0 0;transform:translateY(24px);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.voile.ouvert .feuille{transform:none}
.feuille .tete{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 10px}
.feuille .tete h2{font-size:var(--t-xl);font-style:italic}
html[lang="ar"] .feuille .tete h2{font-style:normal}
.feuille .corps{padding:4px 18px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.feuille .pied{padding:12px 18px calc(14px + var(--sur-bas));border-top:1px solid var(--ligne)}
.feuille .pied:empty{display:none}

/* ---------- message bref ---------- */
#toast{position:fixed;left:50%;bottom:calc(var(--barre) + 20px + var(--sur-bas));transform:translate(-50%,20px);z-index:90;max-width:min(92vw,460px);
  padding:12px 18px;border-radius:14px;background:var(--ivoire);color:var(--encre);font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.4);
  opacity:0;pointer-events:none;transition:.25s;text-align:center}
#toast.voir{opacity:1;transform:translate(-50%,0)}
#toast.err{background:#F6D2C9;color:#5A1B10}
#toast.ok{background:#E3EED7;color:#21361A}

/* ---------- divers ---------- */
.encart{padding:14px 16px;border-radius:14px;border:1px solid rgba(201,164,92,.35);background:rgba(201,164,92,.08);margin-bottom:14px}
.encart.alerte{border-color:rgba(233,185,95,.45);background:rgba(233,185,95,.08)}
.encart b{font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.95rem}
.kv dt{color:var(--sourdine)} .kv dd{margin:0}
.qr{width:168px;height:168px;background:#fff;border-radius:12px;padding:10px;display:grid;place-items:center;color:#333;font-size:.8rem;text-align:center}
.qr svg,.qr img{width:100%;height:100%}
.credit{text-align:center;color:var(--sourdine);font-size:.85rem;margin-top:8px}
.credit a{color:var(--ivoire-2)}
.lien-ligne{display:flex;gap:8px;margin-bottom:8px}
.lien-ligne .saisie:first-child{flex:0 0 36%}
.miniature{width:52px;height:52px;border-radius:6px;object-fit:cover;flex:none;background:var(--velours-3)}
.mosaique-admin button{position:relative;cursor:pointer}
.mosaique-admin .vedette{position:absolute;top:7px;inset-inline-start:7px;width:24px;height:24px;border-radius:50%;background:var(--or);color:var(--encre);display:grid;place-items:center;font-size:.8rem;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.compteur{display:flex;align-items:center;gap:14px;padding:13px 2px;border-bottom:1px solid var(--ligne);width:100%;background:none;border-inline:0;border-top:0;color:inherit;cursor:pointer;text-align:start}
.compteur .n{font-family:"Bodoni Moda",serif;font-size:1.8rem;min-width:42px;color:var(--or-clair);line-height:1}
.compteur .l{flex:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.85rem}
.cal .j{padding:8px 0;border-radius:8px}
.cal .pris{background:rgba(231,130,111,.18);color:var(--danger);text-decoration:line-through}
.cal .entete-j{color:var(--sourdine);font-size:.75rem}
.cal .puce{padding:8px 0;border-radius:8px;font-size:.88rem}
.cal .puce.pris{background:rgba(231,130,111,.14);border-color:transparent}
.cal-legende{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:.84rem;color:var(--sourdine)}
.cal-legende span{display:inline-flex;align-items:center;gap:7px}
.ech{display:inline-block;width:16px;height:16px;border-radius:4px;position:relative;flex:none}
.ech.on{background:var(--ivoire)}
.ech.pris{background:rgba(231,130,111,.22)}
.ech.pris::after{content:"";position:absolute;left:3px;right:3px;top:50%;height:1.5px;margin-top:-.75px;background:var(--danger)}
.jours{display:flex;flex-direction:column}
.jour-ligne{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ligne)}
.jour-ligne:first-child{padding-top:2px}
.jour-ligne:last-child{border-bottom:0}
.jour-date{grid-column:1/-1;font-weight:500}
.jour-date::first-letter,.jours-demande li span::first-letter{text-transform:uppercase}
.jours-demande{list-style:none;margin:0;padding:0}
.jours-demande li{display:flex;flex-direction:column;padding:2px 0 6px}
.jours-demande li span{color:var(--ivoire-2);font-size:.9rem}
/* installation */
.encart-install{display:flex;gap:12px;align-items:flex-start}
.ico-install{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(201,164,92,.16);color:var(--or)}
.ico-install svg{width:19px;height:19px}
.etapes-install li{grid-template-columns:34px 1fr;padding:10px 0}
.etapes-install li::before{font-size:1.5rem}
.bandeau-config{max-width:520px;margin:40px auto;padding:22px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:700px){.mosaique{columns:3}}

/* =====================================================================
   ACHREF SAKOUHI — PHOTOGRAPHE · application (client + administrateur)
   ---------------------------------------------------------------------
   • Les clients créent un compte, regardent le portfolio, demandent une
     date et reçoivent leurs photos et vidéos (liens WeTransfer).
   • Achref (rôle « admin ») envoie les liens, répond aux demandes et
     gère le portfolio, les forfaits, les avis et les réglages.
   • Données : Firebase (voir cloud.js). Textes : français / arabe.
   ===================================================================== */
const APP_VERSION = "1.1.2";
const DEV_INFO = { nom: "Rahmeni Hamdi", mail: "rahmenihamdi@gmail.com", tel: "+216 95 063 068" };
const STUDIO_DEFAUT = {

  accroche: "Racontons votre histoire en images.",
  bio: "Photographe et vidéaste de mariage. Je raconte votre journée, des préparatifs à la dernière danse, avec des images naturelles et soignées.",
  tel: "", whatsapp: "", instagram: "achref_sakouhi_photographe", email: "", ville: "", dureeLien: 3
};
const TYPES_EVT = ["Mariage", "Wtiya", "Henné", "Fiançailles", "Contrat de mariage", "Séance couple", "Portrait", "Événement", "Autre"];
const CATS = ["Mariage", "Wtiya", "Henné", "Fiançailles", "Couple", "Portrait", "Événement"];
const MAX_JOURS = 7;          // jours au plus dans une même demande de réservation

/* ---------------------------------------------------------------- outils */
const esc = s => (s == null ? "" : String(s)).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const nouvelId = p => (p || "x") + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, "0");
const isoDe = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const aujourdHui = () => isoDe(new Date());
const plusJours = (iso, n) => { const [y, m, d] = iso.split("-").map(Number); const x = new Date(y, m - 1, d + n); return isoDe(x); };
const ecartJours = (de, a) => { const f = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((f(a) - f(de)) / 86400000); };
const normTel = s => (s || "").replace(/\s+/g, "").trim();
const cleTel = s => (s || "").replace(/\D/g, "").replace(/^216/, "");
const telAffiche = s => { const d = cleTel(s); return d.length === 8 ? "+216 " + d.slice(0, 2) + " " + d.slice(2, 5) + " " + d.slice(5) : (s || ""); };
const telLien = s => { const d = cleTel(s); return d ? "tel:+216" + d : ""; };
const waLien = (s, texte) => { const d = cleTel(s); return d ? "https://wa.me/216" + d + (texte ? "?text=" + encodeURIComponent(texte) : "") : ""; };
const estEmail = s => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(s || "").trim());
const masquer = e => { const i = String(e || "").indexOf("@"); return i < 1 ? e : e.slice(0, Math.min(2, i)) + "•••" + e.slice(i); };
const initiales = n => (n || "?").trim().split(/\s+/).slice(0, 2).map(x => x[0] || "").join("").toUpperCase() || "?";
// Texte libre affiché (message, avis, bio) : espace insécable avant ! ? ; : » (jamais seuls en début de ligne).
const txt = s => esc(s).replace(/ ([!?;:»])/g, "\u00a0$1").replace(/« /g, "«\u00a0");
const lienValide = u => /^https:\/\/[^\s]+\.[^\s]+/i.test(String(u || "").trim());
const lsGet = (k, d) => { try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } };
const lsSet = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };

/* ---------------------------------------------------------------- langue */
let LANG = (() => { try{ return localStorage.getItem("as_lang") === "ar" ? "ar" : "fr"; }catch(e){ return "fr"; } })();
function tl(lang, s, v){
  if(lang === "ar" && AR[s] == null && /[A-Za-zÀ-ÿ]{3}/.test(s || "")){ try{ (window.__arManquants = window.__arManquants || new Set()).add(s); }catch(e){} }
  let out = (lang === "ar" && AR[s] != null) ? AR[s] : s;
  if(lang === "fr") out = out.replace(/ ([!?;:»])/g, "\u00a0$1").replace(/« /g, "«\u00a0");   // typographie française
  if(v) out = out.replace(/\{(\w+)\}/g, (m, k) => { const x = v[k]; return x == null ? "" : (typeof x === "object" ? (x[lang] != null ? x[lang] : x.fr) : x); });
  return out;
}
const t = (s, v) => tl(LANG, s, v);
const loc = () => LANG === "ar" ? "ar-TN-u-nu-latn" : "fr-FR";
function dateLongue(iso, lang){
  if(!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  try{ return new Intl.DateTimeFormat((lang || LANG) === "ar" ? "ar-TN-u-nu-latn" : "fr-FR", { day: "numeric", month: "long", year: "numeric" }).format(new Date(y, m - 1, d)); }
  catch(e){ return iso; }
}
const locDe = lang => (lang || LANG) === "ar" ? "ar-TN-u-nu-latn" : "fr-FR";
const dateObj = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
function dateCourte(iso, lang){
  if(!iso) return "";
  try{ return new Intl.DateTimeFormat(locDe(lang), { day: "numeric", month: "short" }).format(dateObj(iso)); }catch(e){ return iso; }
}
function dateAvecJour(iso, lang){
  if(!iso) return "";
  try{ return new Intl.DateTimeFormat(locDe(lang), { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(dateObj(iso)); }catch(e){ return iso; }
}
/* Jours d'une demande de réservation : [{ date, type }], triés.
   Les demandes d'avant la version 1.1 n'ont qu'une date et un type. */
const joursDe = d => (d && Array.isArray(d.jours) && d.jours.length ? d.jours : (d && d.date ? [{ date: d.date, type: d.type || "Mariage" }] : []))
  .slice().sort((a, b) => a.date < b.date ? -1 : 1);
const finDe = d => { const j = joursDe(d); return j.length ? j[j.length - 1].date : (d && d.date) || ""; };
// « 12 octobre 2027 » ou « 5–7 juillet 2027 »
function plage(jours, lang){
  const ds = jours.map(j => j.date).sort(); if(!ds.length) return "";
  if(ds.length === 1) return dateLongue(ds[0], lang);
  try{ const f = new Intl.DateTimeFormat(locDe(lang), { day: "numeric", month: "long", year: "numeric" }); if(f.formatRange) return f.formatRange(dateObj(ds[0]), dateObj(ds[ds.length - 1])); }catch(e){}
  return dateLongue(ds[0], lang) + " – " + dateLongue(ds[ds.length - 1], lang);
}
// « Mariage — 12 octobre 2027 » ou « Henné 5 juil., Wtiya 6 juil., Mariage 7 juil. 2027 »
function resumeJours(jours, lang){
  lang = lang || LANG; if(!jours.length) return "";
  if(jours.length === 1) return tl(lang, jours[0].type) + " — " + dateLongue(jours[0].date, lang);
  const annees = Array.from(new Set(jours.map(j => j.date.slice(0, 4))));
  const items = jours.map(j => tl(lang, j.type) + " " + dateCourte(j.date, lang) + (annees.length > 1 ? " " + j.date.slice(0, 4) : ""));
  return items.join(lang === "ar" ? "، " : ", ") + (annees.length === 1 ? " " + annees[0] : "");
}
// Titre court d'une demande : « Mariage — 12 octobre 2027 » ou « 5–7 juillet 2027 (3 jours) »
const titreDemande = d => { const j = joursDe(d); return j.length > 1 ? plage(j) + " (" + t("{n} jours", { n: j.length }) + ")" : (j.length ? t(j[0].type) + " — " + dateLongue(j[0].date) : ""); };
const typesDemande = d => joursDe(d).map(j => t(j.type)).join(" · ");
const moisCourt = iso => { const [y, m, d] = iso.split("-").map(Number); try{ return new Intl.DateTimeFormat(loc(), { month: "short" }).format(new Date(y, m - 1, d)); }catch(e){ return ""; } };
const depuis = ts => { try{ return new Intl.DateTimeFormat(loc(), { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }).format(new Date(ts)); }catch(e){ return ""; } };
const deuxLangues = (fn) => ({ fr: fn("fr"), ar: fn("ar") });

const ico = (n, cls) => `<svg${cls ? ` class="${cls}"` : ""} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONES[n] || ""}</svg>`;
const champMdp = (id, ph, ac) => `<div class="mdp"><input class="saisie" id="${id}" type="password" placeholder="${esc(t(ph))}" autocomplete="${ac}">
  <button type="button" class="oeil" onclick="App.oeil(this)" aria-label="${esc(t("Afficher le mot de passe"))}" title="${esc(t("Afficher le mot de passe"))}">${ico("oeil")}</button></div>`;

/* ---------------------------------------------------------------- installation sur l'écran d'accueil */
const INSTALL = { evt: null };
const estInstallee = () => {
  try{ return matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches || matchMedia("(display-mode: minimal-ui)").matches
    || navigator.standalone === true || document.referrer.indexOf("android-app://") === 0; }catch(e){ return false; }
};
// Chrome (Android, ordinateur) propose l'installation : on garde l'événement pour notre bouton.
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); INSTALL.evt = e; });
window.addEventListener("appinstalled", () => { INSTALL.evt = null; lsSet("as_installee", true); try{ App.apresInstallation(); }catch(x){} });
function navigateur(){
  const ua = navigator.userAgent || "";
  if(/Instagram|FBAN|FBAV|FB_IAB|FBIOS|Messenger|Snapchat|TikTok|musical_ly|Line\//i.test(ua)) return "integre";
  if(/iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) return "ios";
  if(/SamsungBrowser/i.test(ua)) return "samsung";
  if(/Firefox|FxiOS/i.test(ua)) return "firefox";
  if(/Android/i.test(ua)) return "android";
  return "ordinateur";
}

/* ---------------------------------------------------------------- état */
const S = {
  user: null, prof: null, users: [], livraisons: [], demandes: [], avis: [], notifs: [],
  portfolio: [], forfaits: [], studio: Object.assign({}, STUDIO_DEFAUT, lsGet("as_studio", {})), agenda: { datesPrises: [] },
  route: "", param: "", filtrePortfolio: "Tout", filtreLivraisons: "encours", filtreDemandes: "attente", rechercheClients: "",
  calMois: aujourdHui().slice(0, 7), joursChoisis: [], forfaitChoisi: "", pleins: {}
};

/* ================================================================= APP */
const App = {
  _edition: false, _rendu: false, _demarre: false,

  profil(){ return S.prof; },
  estAdmin(){ return !!(S.prof && S.prof.role === "admin"); },
  studio(){
    const st = Object.assign({}, STUDIO_DEFAUT, S.studio || {});
    if(st.metier === "Photographe de mariage" || !st.metier) st.metier = STUDIO_DEFAUT.metier;   // anciens textes par défaut
    if(st.accroche === "Votre histoire, en images." || !st.accroche) st.accroche = STUDIO_DEFAUT.accroche;
    return st;
  },

  /* ------------------------------------------------ démarrage */
  async init(){
    document.documentElement.lang = LANG; document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
    if(estInstallee()) lsSet("as_installee", true);
    try{ localStorage.removeItem("as_gh_token"); }catch(e){}      // ancien réglage « envoi immédiat », supprimé
    if("serviceWorker" in navigator){
      navigator.serviceWorker.register("sw.js").catch(e => console.warn("sw", e));
      navigator.serviceWorker.addEventListener("message", ev => {
        const d = ev.data || {};
        if(d.type === "notif-click" && d.route) this.aller(d.route);
      });
    }
    window.addEventListener("hashchange", () => this.surRoute());
    document.addEventListener("keydown", e => { if(e.key === "Escape"){ if(this._visio) this.fermerVisionneuse(); else this.fermer(); } });
    document.getElementById("app").addEventListener("input", e => { if(e.target.closest("#contenu") && e.target.type !== "file") this._edition = true; });
    // config.js rempli ?
    const fb = (window.APP_CONFIG || {}).firebase || {};
    if(!fb.apiKey || !fb.projectId || /REMPLIR/i.test(fb.apiKey + fb.projectId)){ this.finBoot(); return this.rendreConfig(); }
    // Le module Firebase (cloud.js) se charge depuis Internet : on l'attend 10 secondes au plus.
    for(let i = 0; i < 50 && !window.Cloud; i++) await new Promise(r => setTimeout(r, 200));
    const C = window.Cloud;
    const pret = C ? await Promise.race([C.ready, new Promise(r => setTimeout(() => r(false), 9000))]) : false;
    if(!C || !pret){ this.finBoot(); return this.rendreErreurReseau(); }
    C.onAuth(u => this.onAuth(u));
  },
  finBoot(){ const b = document.getElementById("boot"); if(b){ b.classList.add("fini"); setTimeout(() => b.remove(), 600); } },

  async onAuth(user){
    const C = window.Cloud;
    if(!user){
      C.stopAll(); S.user = null; S.prof = null;
      Object.assign(S, { users: [], livraisons: [], demandes: [], avis: [], notifs: [] });
      this.finBoot(); this.rendreAuth(); return;
    }
    S.user = user;
    let prof = null, lu = false;
    for(const attente of [0, 1200, 3000]){
      if(attente) await new Promise(r => setTimeout(r, attente));
      try{ prof = await C.getProfile(user.uid); lu = true; break; }catch(e){ console.warn("profil", e); }
    }
    if(lu && !prof){
      const p = this._inscription || lsGet("as_inscription", {}) || {};
      prof = { id: user.uid, role: "client", nom: p.nom || "", tel: p.tel || "", email: (user.email || "").toLowerCase(), createdAt: Date.now() };
      try{ await C.put("users", prof); }catch(e){ console.warn("création du profil", e); }
    }
    this._inscription = null; try{ localStorage.removeItem("as_inscription"); }catch(e){}
    if(!prof){ this.toast(t("Connexion instable : réessayez dans un instant."), "err"); try{ await C.signOut(); }catch(e){} return; }
    S.prof = prof;
    const mail = (user.email || "").toLowerCase();
    if(mail && prof.email !== mail) C.patch("users", prof.id, { email: mail }).catch(() => {});
    if(prof.tel) C.syncLoginIndex(cleTel(prof.tel));
    this.demarrerEcoutes();
    // Notifications déjà autorisées sur ce téléphone : on (ré)enregistre le jeton pour ce compte.
    try{ const P = window.Push; if(P && P.supported && P.permission() === "granted") P.register().catch(() => {}); }catch(e){}
    this.finBoot();
    const voulu = (location.hash || "").replace(/^#/, "");
    if(!voulu || !this.routeAutorisee(voulu.split("/")[0])) location.hash = this.estAdmin() ? "#tableau" : "#accueil";
    this.rendre();
  },

  demarrerEcoutes(){
    const uid = S.prof.id, admin = this.estAdmin();
    const spec = admin ? [
      { cle: "users", coll: "users" }, { cle: "livraisons", coll: "livraisons" }, { cle: "demandes", coll: "demandes" },
      { cle: "avis", coll: "avis" }, { cle: "notifs", coll: "notifs", ou: ["target", "admin"] }
    ] : [
      { cle: "prof", doc: ["users", uid] },
      { cle: "livraisons", coll: "livraisons", ou: ["clientId", uid] },
      { cle: "demandes", coll: "demandes", ou: ["clientId", uid] },
      { cle: "avis", coll: "avis", ou: ["publie", true] }, { cle: "avis", coll: "avis", ou: ["clientId", uid] },
      { cle: "notifs", coll: "notifs", ou: ["target", uid] }
    ];
    spec.push({ cle: "portfolio", coll: "portfolio" }, { cle: "forfaits", coll: "forfaits" },
              { cle: "studio", doc: ["_config", "studio"] }, { cle: "agenda", doc: ["_config", "agenda"] });
    window.Cloud.watch(spec, (cle, data) => this.surDonnees(cle, data));
  },
  surDonnees(cle, data){
    if(cle === "prof"){
      if(!data) return;
      if(S.prof && data.role !== S.prof.role){ location.reload(); return; }   // rôle changé dans la console
      S.prof = data;
    } else if(cle === "users"){
      S.users = data || [];
      const moi = S.users.find(u => u.id === (S.prof && S.prof.id));
      if(moi) S.prof = moi;
    } else if(cle === "studio"){
      S.studio = Object.assign({}, STUDIO_DEFAUT, data || {}); lsSet("as_studio", data || {});
      if(data && this.estAdmin()){            // anciens textes par défaut remplacés une fois dans la base
        const maj = {};
        if(data.metier === "Photographe de mariage") maj.metier = STUDIO_DEFAUT.metier;
        if(data.accroche === "Votre histoire, en images.") maj.accroche = STUDIO_DEFAUT.accroche;
        if(Object.keys(maj).length) window.Cloud.patch("_config", "studio", maj).catch(() => {});
      }
    } else if(cle === "agenda"){
      S.agenda = Object.assign({ datesPrises: [] }, data || {});
    } else {
      S[cle] = data || [];
    }
    if(cle === "notifs") this._sonnerSiNouveau();
    this.planifier();
  },
  planifier(){
    if(this._rendu) return; this._rendu = true;
    requestAnimationFrame(() => { this._rendu = false; if(S.prof) this.rendre(true); });
  },

  /* ------------------------------------------------ navigation */
  routeAutorisee(r){
    const client = ["accueil", "portfolio", "photos", "reserver", "compte", "apropos"];
    const admin = ["tableau", "livraisons", "clients", "demandes", "plus", "a-portfolio", "a-forfaits", "a-avis", "reglages", "apropos", "portfolio"];
    return (this.estAdmin() ? admin : client).indexOf(r) >= 0;
  },
  aller(route){ if(("#" + route) === location.hash) this.surRoute(); else location.hash = "#" + route; },
  surRoute(){
    if(!S.prof) return;
    const [r, p] = (location.hash || "").replace(/^#/, "").split("/");
    if(!this.routeAutorisee(r)){ location.hash = this.estAdmin() ? "#tableau" : "#accueil"; return; }
    this._edition = false; this.rendre(); window.scrollTo(0, 0);
  },

  /* ------------------------------------------------ rendu principal */
  rendre(auto){
    const app = document.getElementById("app");
    const [r, p] = (location.hash || "").replace(/^#/, "").split("/");
    S.route = r || (this.estAdmin() ? "tableau" : "accueil"); S.param = p || "";
    if(!app.querySelector("#contenu")){
      app.innerHTML = `<div class="ecran"><header class="entete" id="entete"></header><main class="contenu" id="contenu"></main></div><nav class="onglets" id="onglets"></nav>`;
    }
    document.getElementById("entete").innerHTML = this.vueEntete();
    document.getElementById("onglets").innerHTML = this.vueOnglets();
    if(auto && this._edition) return;          // ne pas effacer une saisie en cours
    const page = {
      accueil: () => this.pageAccueil(), portfolio: () => this.pagePortfolio(), photos: () => this.pagePhotos(),
      reserver: () => this.pageReserver(), compte: () => this.pageCompte(), apropos: () => this.pageApropos(),
      tableau: () => this.pageTableau(), livraisons: () => this.pageLivraisons(), clients: () => this.pageClients(),
      demandes: () => this.pageDemandes(), plus: () => this.pagePlus(), "a-portfolio": () => this.pageAdminPortfolio(),
      "a-forfaits": () => this.pageAdminForfaits(), "a-avis": () => this.pageAdminAvis(), reglages: () => this.pageReglages()
    }[S.route];
    const c = document.getElementById("contenu");
    c.innerHTML = page ? page() : "";
    const apres = this["apres_" + S.route.replace("-", "_")];
    if(apres) apres.call(this);
  },
  vueEntete(){
    const st = this.studio(), nonLues = S.notifs.filter(n => !n.lu).length;
    return `<a class="marque" href="#${this.estAdmin() ? "tableau" : "accueil"}"><img src="logo-mark.png" alt="">
        <span><span class="nom">${esc(st.nom)}</span><span class="metier">${esc(this.estAdmin() ? t("Espace photographe") : t(st.metier))}</span></span></a>
      <button class="btn-icone btn-langue" onclick="App.changerLangue()" title="${esc(t("Changer de langue"))}">${LANG === "ar" ? "Français" : "العربية"}</button>
      <button class="btn-icone" id="btn-cloche" onclick="App.ouvrirCloche()" aria-label="${esc(t("Notifications"))}">${ico("cloche")}${nonLues ? `<span class="pastille">${nonLues > 9 ? "9+" : nonLues}</span>` : ""}</button>
      <button class="btn-icone" id="btn-sortir" onclick="App.demanderDeconnexion()" aria-label="${esc(t("Se déconnecter"))}" title="${esc(t("Se déconnecter"))}">${ico("sortir")}</button>`;
  },
  vueOnglets(){
    const actif = r => {
      const groupe = { apropos: this.estAdmin() ? "plus" : "compte", "a-portfolio": "plus", "a-forfaits": "plus", "a-avis": "plus", reglages: "plus", portfolio: this.estAdmin() ? "plus" : "portfolio" };
      return (groupe[S.route] || S.route) === r ? " actif" : "";
    };
    const pastille = n => n ? `<span class="pastille">${n > 9 ? "9+" : n}</span>` : "";
    const items = this.estAdmin() ? [
      ["tableau", "tableau", "Tableau", 0], ["livraisons", "envoyer", "Livraisons", 0], ["clients", "clients", "Clients", 0],
      ["demandes", "boite", "Demandes", S.demandes.filter(d => d.statut === "attente").length], ["plus", "plus3", "Plus", S.avis.filter(a => !a.publie).length]
    ] : [
      ["accueil", "accueil", "Accueil", 0], ["portfolio", "grille", "Portfolio", 0],
      ["photos", "image", "Mes photos", S.livraisons.filter(l => !l.vuAt).length], ["reserver", "calendrier", "Réserver", 0], ["compte", "personne", "Compte", 0]

  retour(route, libelle){ return `<button class="lien" style="margin:6px 0 4px;text-decoration:none" onclick="App.aller('${route}')">${LANG === "ar" ? "→" : "←"} ${esc(t(libelle))}</button>`; },

            <div class="aide">${esc(t("Au moins 8 caractères, avec une majuscule, une minuscule, un chiffre et un symbole."))}</div></div>
          <button class="btn btn-or btn-bloc" id="in-go">${esc(t("Créer mon compte"))}</button>
          <p class="discret" style="text-align:center;margin-top:12px">${esc(t("En créant un compte, vous acceptez la"))} <a href="confidentialite.html">${esc(t("politique de confidentialité"))}</a>.</p>

          <div class="champ" style="margin-bottom:8px"><label for="co-pass">${esc(t("Mot de passe"))}</label>${champMdp("co-pass", "Votre mot de passe", "current-password")}</div>
          <div class="oubli"><button type="button" class="lien" onclick="App.ouvrirOubli()">${esc(t("Mot de passe oublié ?"))}</button></div>
          <button class="btn btn-or btn-bloc" id="co-go">${esc(t("Se connecter"))}</button>
        </form>
        <div class="legal"><a href="confidentialite.html">${esc(t("Politique de confidentialité"))}</a><a href="suppression-compte.html">${esc(t("Suppression de compte"))}</a></div>`}

          <p class="discret">${esc(t("Ajoutez l'app sur l'écran d'accueil de votre téléphone, comme une vraie application."))}</p></div>`}
      </section></div>`;
  },

  /* ------------------------------------------------ connexion / inscription */
  verifMdp(p){
    p = p || "";
    if(p.length < 8) return t("Mot de passe : au moins 8 caractères.");
    if(!/[A-Z]/.test(p)) return t("Mot de passe : au moins une lettre majuscule.");
    if(!/[a-z]/.test(p)) return t("Mot de passe : au moins une lettre minuscule.");
    if(!/[0-9]/.test(p)) return t("Mot de passe : au moins un chiffre.");
    if(!/[^A-Za-z0-9]/.test(p)) return t("Mot de passe : au moins un symbole (! ? @ # …).");
    return null;
  },
  erreurAuth(err){
    const c = (err && err.code) || "";
    if(/email-already-in-use/.test(c)) return t("Cette adresse e-mail a déjà un compte. Connectez-vous ou utilisez « Mot de passe oublié ».");
    if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return t("Identifiant ou mot de passe incorrect.");
    if(/invalid-email/.test(c)) return t("Adresse e-mail invalide.");
    if(/weak-password/.test(c)) return t("Mot de passe trop faible.");
    if(/requires-recent-login/.test(c)) return t("Reconnectez-vous puis réessayez.");
    if(/too-many-requests/.test(c)) return t("Trop de tentatives. Réessayez dans quelques minutes.");
    if(/network/.test(c)) return t("Problème de connexion Internet.");
    return t("Une erreur s'est produite. Réessayez.");
  },
  async connecter(){
    const id = (document.getElementById("co-id").value || "").trim(), pass = document.getElementById("co-pass").value;
    if(!id || !pass) return this.toast(t("Remplissez tous les champs."), "err");
    const btn = document.getElementById("co-go"); btn.disabled = true;
    try{
      let essais = [];
      if(id.indexOf("@") >= 0) essais = [id.toLowerCase()];
      else{
        const cle = cleTel(id);
        if(!cle) { btn.disabled = false; return this.toast(t("Numéro de téléphone invalide."), "err"); }
        const ent = await window.Cloud.lookupPhone(cle);
        if(ent && ent.email) essais.push(String(ent.email).toLowerCase());
        if(ent && ent.pending) essais.push(String(ent.pending).toLowerCase());
        if(!essais.length){ btn.disabled = false; return this.toast(t("Aucun compte avec ce numéro. Vérifiez-le ou connectez-vous avec votre e-mail."), "err"); }
      }
      let derniere = null;
      for(const m of essais){
        try{ await window.Cloud.signIn(m, pass); derniere = null; break; }
        catch(e){ derniere = e; if(!/invalid-credential|wrong-password|user-not-found|invalid-login/.test((e && e.code) || "")) break; }
      }
      if(derniere) throw derniere;
    }catch(e){ this.toast(this.erreurAuth(e), "err"); btn.disabled = false; }
  },
  async inscrire(){
    const g = id => (document.getElementById(id).value || "").trim();
    const nom = g("in-nom"), tel = normTel(g("in-tel")), email = g("in-email").toLowerCase(), pass = document.getElementById("in-pass").value;
    if(!nom || !tel || !email || !pass) return this.toast(t("Remplissez tous les champs."), "err");
    const cle = cleTel(tel);
    if(cle.length < 8) return this.toast(t("Numéro de téléphone invalide."), "err");
    if(!estEmail(email)) return this.toast(t("Adresse e-mail invalide."), "err");
    const pb = this.verifMdp(pass); if(pb) return this.toast(pb, "err");
    const btn = document.getElementById("in-go"); btn.disabled = true;
    try{
      const ent = await window.Cloud.lookupPhone(cle);
      if(ent && ent.uid){ btn.disabled = false; return this.toast(t("Ce numéro a déjà un compte. Connectez-vous ou utilisez « Mot de passe oublié »."), "err"); }
      this._inscription = { nom, tel, email }; lsSet("as_inscription", this._inscription);
      await window.Cloud.signUp(email, pass);
      this.toast(t("Bienvenue ! Votre compte est créé."), "ok");
    }catch(e){
      this._inscription = null; try{ localStorage.removeItem("as_inscription"); }catch(x){}
      this.toast(this.erreurAuth(e), "err"); btn.disabled = false;
    }
  },
  ouvrirOubli(){
    const pre = ((document.getElementById("co-id") || {}).value || "").trim();
    this.feuille(t("Mot de passe oublié"), `
      <p class="doux">${esc(t("Nous vous envoyons un lien par e-mail pour choisir un nouveau mot de passe."))}</p>
      <div class="champ"><label for="mo-id">${esc(t("E-mail ou numéro de téléphone"))}</label>
        <input class="saisie" id="mo-id" value="${esc(pre)}" placeholder="${esc(t("Votre numéro ou votre e-mail"))}" autocapitalize="none" spellcheck="false"></div>
      <div id="mo-res"></div>`,
      `<button class="btn btn-or btn-bloc" id="mo-go" onclick="App.envoyerOubli()">${esc(t("Envoyer le lien"))}</button>`);
  },
  async envoyerOubli(){
    const raw = (document.getElementById("mo-id").value || "").trim(), res = document.getElementById("mo-res"), btn = document.getElementById("mo-go");
    if(!raw) return this.toast(t("Saisissez votre e-mail ou votre numéro."), "err");
    let mail = "", parTel = false;
    btn.disabled = true;
    if(raw.indexOf("@") >= 0){ mail = raw.toLowerCase(); if(!estEmail(mail)){ btn.disabled = false; return this.toast(t("Adresse e-mail invalide."), "err"); } }
    else{
      const cle = cleTel(raw); if(!cle){ btn.disabled = false; return this.toast(t("Numéro de téléphone invalide."), "err"); }
      parTel = true; const ent = await window.Cloud.lookupPhone(cle); mail = ent && ent.email ? String(ent.email).toLowerCase() : "";
    }
    if(!mail){
      btn.disabled = false;
      res.innerHTML = `<div class="encart alerte"><b>${esc(t("Aucun compte avec ce numéro."))}</b><div class="discret" style="margin-top:4px">${esc(t("Vérifiez le numéro, ou saisissez votre adresse e-mail."))}</div></div>`;
      return;
    }
    try{ await window.Cloud.resetPassword(mail); }
    catch(e){ if(!/user-not-found/.test((e && e.code) || "")){ btn.disabled = false; return this.toast(this.erreurAuth(e), "err"); } }
    res.innerHTML = `<div class="encart"><b>${esc(t("E-mail envoyé"))}</b>
      <div style="margin-top:6px">${esc(t("Si un compte existe, un lien a été envoyé à :"))} <b dir="ltr">${esc(parTel ? masquer(mail) : mail)}</b></div>
      <div class="discret" style="margin-top:6px">${esc(t("Ouvrez l'e-mail, touchez le lien et choisissez un nouveau mot de passe. Pensez à regarder dans les spams."))}</div></div>`;
    btn.disabled = false; btn.textContent = t("Retour à la connexion"); btn.onclick = () => this.fermer();
  },
  async demanderDeconnexion(){
    if(await this.confirmer(t("Se déconnecter ?"), t("Vous pourrez vous reconnecter avec votre numéro ou votre e-mail."), t("Se déconnecter"))) this.deconnecter();
  },
  async deconnecter(){
    try{ window.Cloud.stopAll(); }catch(e){}          // plus d'écoute avant de quitter le compte
    try{ await window.Push.unlink(); }catch(e){}
    try{ await window.Cloud.signOut(); }catch(e){}
    location.hash = ""; location.reload();
  },
  oeil(b){
    const inp = b.parentNode.querySelector("input"), voir = inp.type === "password";
    inp.type = voir ? "text" : "password"; b.innerHTML = ico(voir ? "oeilBarre" : "oeil"); b.classList.toggle("on", voir);
    b.title = t(voir ? "Masquer le mot de passe" : "Afficher le mot de passe"); b.setAttribute("aria-label", b.title);
  },
  changerLangue(){
    LANG = LANG === "ar" ? "fr" : "ar"; try{ localStorage.setItem("as_lang", LANG); }catch(e){}
    document.documentElement.lang = LANG; document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
    try{ window.Push && window.Push.relink(); }catch(e){}
    if(S.prof){ this._edition = false; this.rendre(); } else if(window.Cloud && window.Cloud.configOK) this.rendreAuth(); else this.rendreConfig();
  },

  /* ------------------------------------------------ fenêtres, messages */
  feuille(titre, corps, pied){
    let v = document.getElementById("voile");
    if(!v){ v = document.createElement("div"); v.id = "voile"; v.className = "voile"; v.addEventListener("click", e => { if(e.target === v) this.fermer(); }); document.body.appendChild(v); }
    v.innerHTML = `<div class="feuille" role="dialog" aria-modal="true" aria-label="${esc(titre)}"><div class="tete"><h2>${esc(titre)}</h2>
      <button class="btn-icone" onclick="App.fermer()" aria-label="${esc(t("Fermer"))}">${ico("fermer")}</button></div>
      <div class="corps">${corps}</div><div class="pied">${pied || ""}</div></div>`;
    requestAnimationFrame(() => v.classList.add("ouvert"));
    document.body.style.overflow = "hidden";
  },
  fermer(){ const v = document.getElementById("voile"); if(v) v.classList.remove("ouvert"); document.body.style.overflow = ""; },
  confirmer(titre, texte, ok, danger){
    return new Promise(res => {
      this._conf = res;
      this.feuille(titre, `<p class="doux">${esc(texte)}</p>`,
        `<div class="rangee"><button class="btn btn-clair" onclick="App._repondre(false)">${esc(t("Annuler"))}</button>
         <button class="btn ${danger ? "btn-danger" : "btn-or"}" onclick="App._repondre(true)">${esc(ok)}</button></div>`);
    });
  },
  _repondre(v){ this.fermer(); const r = this._conf; this._conf = null; if(r) r(v); },
  toast(msg, type){
    const el = document.getElementById("toast"); el.textContent = msg; el.className = "voir" + (type ? " " + type : "");
    clearTimeout(this._tt); this._tt = setTimeout(() => { el.className = ""; }, 3200);
  },

  /* ------------------------------------------------ notifications */
  // Crée une notification (dans l'app + push). Les textes sont gardés en français et en arabe.
  async notifier(target, kind, titre, texte, vars, lien){
    const n = { id: nouvelId("n"), target, kind,
      fr: { t: tl("fr", titre, vars), b: tl("fr", texte, vars) }, ar: { t: tl("ar", titre, vars), b: tl("ar", texte, vars) },
      lien: lien || "", ts: Date.now(), lu: false, envoi: "attente" };
    try{ await window.Cloud.put("notifs", n); }catch(e){ console.warn("notif", e); }
  },
  _sonnerSiNouveau(){
    const n = S.notifs.filter(x => !x.lu).length;
    if(this._nbNonLues != null && n > this._nbNonLues){ const b = document.getElementById("btn-cloche"); if(b && b.animate) b.animate([{ transform: "rotate(0)" }, { transform: "rotate(14deg)" }, { transform: "rotate(-10deg)" }, { transform: "rotate(0)" }], { duration: 600 }); }
    this._nbNonLues = n;
  },
  ouvrirCloche(){
    const liste = S.notifs.slice().sort((a, b) => b.ts - a.ts).slice(0, 60);
    const corps = liste.length ? `<div class="liste">${liste.map(n => {
      const x = n[LANG] || n.fr || {};
      return `<button class="ligne" onclick="App.ouvrirNotif('${n.id}')"><span class="avatar" style="${n.lu ? "" : "border-color:var(--or)"}">${ico("cloche")}</span>
        <span class="corps"><span class="t">${esc(x.t)}</span><span class="s" style="white-space:normal">${esc(x.b)}</span><span class="discret">${esc(depuis(n.ts))}</span></span></button>`;
    }).join("")}</div>` : `<div class="vide">${ico("cloche")}<h3>${esc(t("Rien de nouveau"))}</h3><p>${esc(t("Vos notifications apparaîtront ici."))}</p></div>`;
    const pied = liste.some(n => !n.lu) ? `<button class="btn btn-bloc" onclick="App.toutLu()">${esc(t("Tout marquer comme lu"))}</button>` : "";
    this.feuille(t("Notifications"), corps, pied);

  ouvrirNotif(id){
    const n = S.notifs.find(x => x.id === id); if(!n) return;
    if(!n.lu) window.Cloud.patch("notifs", id, { lu: true }).catch(() => {});
    this.fermer(); if(n.lien) this.aller(n.lien.replace(/^#/, ""));
  },
  toutLu(){ S.notifs.filter(n => !n.lu).forEach(n => window.Cloud.patch("notifs", n.id, { lu: true }).catch(() => {})); this.fermer(); },
  onPushPremierPlan(d){ if(d && d.title) this.toast(d.title + (d.body ? " — " + d.body : "")); },
  etatPush(){ try{ return window.Push ? window.Push.etat() : "indisponible"; }catch(e){ return "indisponible"; } },
  async activerNotifs(){
    try{ await window.Push.register(); this.toast(t("Notifications activées."), "ok"); }
    catch(e){
      const m = String((e && e.message) || e);
      if(m === "denied") this.toast(t("Notifications refusées. Autorisez-les dans les réglages du téléphone."), "err");
      else if(/SamsungBrowser/i.test(navigator.userAgent || "")) this.toast(t("Notifications indisponibles avec Samsung Internet : ouvrez l'app avec Chrome."), "err");
      else this.toast(t("Activation impossible. Vérifiez la connexion."), "err");
    }
    this.rendre();
  },
  async desactiverNotifs(){ try{ await window.Push.disable(); }catch(e){} this.toast(t("Notifications désactivées sur cet appareil.")); this.rendre(); },
  vueNotifs(client){

    if(st === "granted") return `<div class="bloc"><h3>${esc(t("Notifications"))}</h3><p class="doux">${esc(client ? t("Ce téléphone sera prévenu dès que vos photos sont prêtes.") : t("Ce téléphone reçoit les nouvelles demandes et les messages des clients."))}</p>
      <button class="btn btn-clair btn-petit" onclick="App.desactiverNotifs()">${esc(t("Désactiver sur cet appareil"))}</button></div>`;
    const txt = { default: client ? t("Activez les notifications pour être prévenu(e) dès que vos photos et vidéos sont prêtes.") : t("Activez les notifications pour être prévenu des nouvelles demandes."),
      denied: t("Les notifications sont bloquées. Autorisez-les dans les réglages du téléphone, rubrique Applications."),
      "ios-installer": t("Sur iPhone : touchez Partager, puis « Sur l'écran d'accueil », et ouvrez l'app depuis son icône."),
      indisponible: t("Ce navigateur ne gère pas les notifications. Ouvrez l'app avec Chrome."),
      "non-configure": client ? t("Les notifications seront bientôt disponibles.") : t("Notifications pas encore configurées : ajoutez la clé vapidKey dans config.js (voir LISEZ-MOI, étape 1.5).") }[st] || "";
    return `<div class="bloc"><h3>${esc(t("Notifications"))}</h3><p class="doux">${esc(txt)}</p>
      ${st === "default" ? `<button class="btn btn-or" onclick="App.activerNotifs()">${ico("cloche")} ${esc(t("Activer les notifications"))}</button>` : ""}</div>`;

  ouvrirVisionneuse(i){
    this._visio = { liste: this.photosFiltrees(), i };

    v.hidden = false; document.body.style.overflow = "hidden";

    sc.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
    sc.addEventListener("touchend", e => { if(x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if(Math.abs(dx) > 50) this.pasVisionneuse((dx < 0 ? 1 : -1) * (LANG === "ar" ? -1 : 1)); });
    this.majVisionneuse();

  majVisionneuse(){
    const V = this._visio; if(!V) return; const p = V.liste[V.i]; if(!p) return;

    document.getElementById("vi-n").textContent = (V.i + 1) + " / " + V.liste.length;
    document.getElementById("vi-leg").textContent = p.legende || t(p.cat);
    document.querySelectorAll("#visio .nav").forEach(b => { b.style.visibility = V.liste.length > 1 ? "visible" : "hidden"; });
    this.imagePleine(p.id).then(src => { if(this._visio && this._visio.liste[this._visio.i] === p){ if(src) img.src = src; img.classList.remove("flou"); } });
  },
  pasVisionneuse(d){ const V = this._visio; if(!V) return; V.i = (V.i + d + V.liste.length) % V.liste.length; this.majVisionneuse(); },

  vueCalendrier(){
    const [y, m] = S.calMois.split("-").map(Number), premier = new Date(y, m - 1, 1), nb = new Date(y, m, 0).getDate();
    const decal = (premier.getDay() + 6) % 7, auj = aujourdHui(), pris = (S.agenda.datesPrises || []);
    let titre = ""; try{ titre = new Intl.DateTimeFormat(loc(), { month: "long", year: "numeric" }).format(premier); }catch(e){ titre = S.calMois; }
    const jours = []; for(let i = 0; i < 7; i++){ const d = new Date(2024, 0, 1 + i); try{ jours.push(new Intl.DateTimeFormat(loc(), { weekday: "narrow" }).format(d)); }catch(e){ jours.push(""); } }
    let cases = jours.map(j => `<span class="entete-j">${esc(j)}</span>`).join("");
    for(let i = 0; i < decal; i++) cases += "<span></span>";
    for(let d = 1; d <= nb; d++){
      const iso = y + "-" + pad(m) + "-" + pad(d), passe = iso < auj, estPris = pris.indexOf(iso) >= 0, choisi = S.joursChoisis.some(j => j.date === iso);
      cases += passe ? `<span class="j" style="opacity:.3">${d}</span>`

    }
    const moisPrec = S.calMois > auj.slice(0, 7);
    return `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">

  vueJoursChoisis(){
    const J = S.joursChoisis.slice().sort((a, b) => a.date < b.date ? -1 : 1);
    if(!J.length) return `<p class="discret" style="margin:0">${esc(t("Aucun jour choisi : touchez une date libre dans le calendrier."))}</p>`;
    return `<div class="jours">${J.map(j => `<div class="jour-ligne"><span class="jour-date">${esc(dateAvecJour(j.date))}</span>
        <select class="saisie" aria-label="${esc(t("Événement"))} — ${esc(dateLongue(j.date))}" onchange="App.typeJour('${j.date}',this.value)">${TYPES_EVT.map(x => `<option value="${esc(x)}"${x === j.type ? " selected" : ""}>${esc(t(x))}</option>`).join("")}</select>
        <button type="button" class="btn-icone" onclick="App.basculerJour('${j.date}')" aria-label="${esc(t("Retirer ce jour"))}" title="${esc(t("Retirer ce jour"))}">${ico("fermer")}</button></div>`).join("")}</div>`;

  majReserver(){
    const cal = document.getElementById("cal"); if(cal) cal.parentNode.innerHTML = this.vueCalendrier();
    const jr = document.getElementById("re-jours"); if(jr) jr.innerHTML = this.vueJoursChoisis();

  changerMois(d){
    const [y, m] = S.calMois.split("-").map(Number), x = new Date(y, m - 1 + d, 1);
    S.calMois = x.getFullYear() + "-" + pad(x.getMonth() + 1);
    const bloc = document.getElementById("cal"); if(bloc) bloc.parentNode.innerHTML = this.vueCalendrier();
  },
  // Touche d'un jour : l'ajoute ou le retire de la demande.
  basculerJour(iso){
    if(!iso || iso < aujourdHui()) return;
    const i = S.joursChoisis.findIndex(j => j.date === iso);
    if(i >= 0) S.joursChoisis.splice(i, 1);
    else{
      if((S.agenda.datesPrises || []).indexOf(iso) >= 0) return this.toast(t("Ce jour est déjà réservé. Choisissez-en un autre ou écrivez à Achref."), "err");
      if(S.joursChoisis.length >= MAX_JOURS) return this.toast(t("{n} jours au plus par demande.", { n: MAX_JOURS }), "err");
      S.joursChoisis.push({ date: iso, type: "Mariage" });
    }
    this._edition = true; this.majReserver();
  },
  typeJour(iso, type){ const j = S.joursChoisis.find(x => x.date === iso); if(j && TYPES_EVT.indexOf(type) >= 0) j.type = type; this._edition = true; },
  choisirForfait(id){ S.forfaitChoisi = id || ""; },
  async envoyerDemande(){
    const g = id => ((document.getElementById(id) || {}).value || "").trim();
    const lieu = g("re-lieu"), fid = g("re-forfait"), msg = g("re-msg");
    const jours = S.joursChoisis.slice().sort((a, b) => a.date < b.date ? -1 : 1).map(j => ({ date: j.date, type: j.type }));
    if(!jours.length) return this.toast(t("Choisissez au moins un jour dans le calendrier."), "err");
    if(jours.some(j => j.date < aujourdHui())) return this.toast(t("Cette date est passée."), "err");
    const pris = S.agenda.datesPrises || [], bloque = jours.find(j => pris.indexOf(j.date) >= 0);
    if(bloque) return this.toast(t("Le {date} est déjà réservé. Retirez ce jour ou écrivez à Achref.", { date: dateLongue(bloque.date) }), "err");
    const f = S.forfaits.find(x => x.id === fid), u = S.prof;
    const d = { id: nouvelId("d"), clientId: u.id, clientNom: u.nom || "", clientTel: u.tel || "", clientEmail: u.email || "",
      jours, date: jours[0].date, dateFin: jours[jours.length - 1].date, type: jours[0].type,
      lieu, forfaitId: f ? f.id : "", forfaitNom: f ? f.nom : "", message: msg, statut: "attente", noteAdmin: "", createdAt: Date.now(), updatedAt: Date.now() };
    const btn = document.getElementById("re-go"); btn.disabled = true;
    try{
      await window.Cloud.put("demandes", d);
      this.notifier("admin", "demande", "Nouvelle demande", "{nom} : {details}.", { nom: u.nom || t("Un client"), details: deuxLangues(l => resumeJours(jours, l)) }, "demandes/" + d.id);
      S.joursChoisis = []; S.forfaitChoisi = ""; this._edition = false;
      this.toast(t("Demande envoyée. Achref vous répond très vite."), "ok"); this.rendre();
    }catch(e){ btn.disabled = false; this.toast(t("Envoi impossible. Vérifiez la connexion."), "err"); }

  pageTableau(){
    const auj = aujourdHui(), st = this.studio();
    const attente = S.demandes.filter(d => d.statut === "attente").length;
    const nonTel = S.livraisons.filter(l => !l.telechargeAt && ecartJours(auj, l.expireLe) >= 0).length;
    const bientot = S.livraisons.filter(l => !l.telechargeAt && ecartJours(auj, l.expireLe) >= 0 && ecartJours(auj, l.expireLe) <= 1).length;
    const nouveauLien = S.livraisons.filter(l => l.nouveauLienDemandeAt && !l.telechargeAt && ecartJours(auj, l.expireLe) < 0).length;

  async enregistrerLivraison(){
    const L = this._liv, g = id => (document.getElementById(id).value || "").trim();
    const c = S.users.find(u => u.id === L.clientId);
    if(!c) return this.toast(t("Choisissez le client."), "err");
    const titre = g("lv-titre"), type = g("lv-type"), dateEvt = g("lv-date"), expireLe = g("lv-exp"), message = g("lv-msg");
    const liens = L.liens.filter(x => x.url).map(x => ({ label: (x.label || "").trim() || t("Fichiers"), url: x.url.trim() }));
    if(!titre) return this.toast(t("Donnez un titre à la livraison."), "err");
    if(!liens.length) return this.toast(t("Ajoutez au moins un lien."), "err");
    if(liens.some(x => !lienValide(x.url))) return this.toast(t("Un lien n'est pas valide : il doit commencer par https://"), "err");
    if(!expireLe) return this.toast(t("Indiquez la date d'expiration du lien."), "err");
    const prevenir = document.getElementById("lv-prev").checked;
    const ancien = L.id ? S.livraisons.find(x => x.id === L.id) : null;
    const liensChanges = !ancien || JSON.stringify(ancien.liens) !== JSON.stringify(liens) || ancien.expireLe !== expireLe;
    const obj = { id: L.id || nouvelId("l"), clientId: c.id, clientNom: c.nom || "", titre, type, dateEvt, liens, expireLe, message, updatedAt: Date.now() };
    if(!ancien) Object.assign(obj, { createdAt: Date.now(), vuAt: null, telechargeAt: null, rappelEnvoye: false, nouveauLienDemandeAt: null });
    else if(liensChanges) Object.assign(obj, { vuAt: null, telechargeAt: null, rappelEnvoye: false, nouveauLienDemandeAt: null });
    document.getElementById("lv-go").disabled = true;
    try{
      await window.Cloud.put("livraisons", obj);
      if(prevenir) await this.notifier(c.id, "livraison", "Vos photos sont prêtes", "« {titre} » : téléchargez vos fichiers avant le {date}.", { titre, date: deuxLangues(l => dateLongue(expireLe, l)) }, "photos/" + obj.id);
      this.fermer(); this.toast(prevenir ? t("Envoyé à {nom}.", { nom: c.nom || t("le client") }) : t("Livraison enregistrée."), "ok");
    }catch(e){ console.warn(e); document.getElementById("lv-go").disabled = false; this.toast(t("Enregistrement impossible. Vérifiez la connexion."), "err"); }
  },

  async repondreDemande(id, statut){
    const d = S.demandes.find(x => x.id === id); if(!d) return;
    const note = (document.getElementById("dm-note").value || "").trim();
    try{
      await window.Cloud.patch("demandes", id, { statut, noteAdmin: note, updatedAt: Date.now() });
      // Tous les jours de la demande sont pris (confirmée) ou libérés (si elle était confirmée).
      let dates = (S.agenda.datesPrises || []).slice();
      const jours = joursDe(d).map(j => j.date);
      if(statut === "confirmee") jours.forEach(x => { if(dates.indexOf(x) < 0) dates.push(x); });
      else if(d.statut === "confirmee") dates = dates.filter(x => jours.indexOf(x) < 0);
      dates.sort();
      if(JSON.stringify(dates) !== JSON.stringify((S.agenda.datesPrises || []).slice().sort())) await window.Cloud.put("_config", { id: "agenda", datesPrises: dates });
      const vars = { date: deuxLangues(l => plage(joursDe(d), l)) };
      if(statut === "confirmee") await this.notifier(d.clientId, "demande", "Date confirmée", "Votre demande du {date} est confirmée.", vars, "reserver");
      else await this.notifier(d.clientId, "demande", "Réponse à votre demande", "Achref a répondu à votre demande du {date}.", vars, "reserver");
      this.fermer(); this.toast(statut === "confirmee" ? t("Date confirmée. Le client est prévenu.") : t("Réponse envoyée au client."), "ok");
    }catch(e){ console.warn(e); this.toast(t("Enregistrement impossible. Vérifiez la connexion."), "err"); }
  },

  reduireImage(fichier, max, qualite){
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onerror = rej;
      r.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight; const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
        const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h);
        let q = qualite, data = c.toDataURL("image/jpeg", q);
        while(data.length > 900000 && q > 0.45){ q -= 0.08; data = c.toDataURL("image/jpeg", q); }
        res({ data, w, h });
      }; img.src = r.result; };
      r.readAsDataURL(fichier);
    });
  },

        await window.Cloud.put("portfolioFull", { id, data: plein.data });

        S.pleins[id] = plein.data; ok++;
      }catch(e){ console.warn("photo", e); }
    }
    this.toast(t("{n} photo(s) ajoutée(s).", { n: ok }), ok ? "ok" : "err"); this._edition = false; this.rendre();
  },
